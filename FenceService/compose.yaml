services:
  api:
    image: api
    build:
      context: .
      dockerfile: Api/Dockerfile
      secrets: [github_token]
    environment:
      MongoDb__ConnectionString: mongodb://user:password1234@mongodb:27017
      MongoDb__DatabaseName: fence-service
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: fence-service-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password1234
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN